name: Astro CI/CD Deploy to Vercel (Auto Project Creation)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Vercel (auto-create project)
        run: |
          npm install -g vercel
          vercel --prod --confirm --yes --token ${{ secrets.VERCEL_TOKEN }}
